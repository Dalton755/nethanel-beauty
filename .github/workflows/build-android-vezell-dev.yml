name: Build Android Vezell DEV

on:
  push:
    branches: [main]
    paths:
      - 'native/android/vezell/**'
      - '.github/workflows/build-android-vezell-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;36.1.0"

          BW_SDK="$HOME/.bubblewrap/android-sdk-wrapper"
          mkdir -p "$BW_SDK/bin"
          ln -sfn "$SDKMANAGER" "$BW_SDK/bin/sdkmanager"
          for dir in build-tools platform-tools platforms licenses cmdline-tools; do
            if [ -e "$ANDROID_HOME/$dir" ]; then
              rm -rf "$BW_SDK/$dir"
              ln -s "$ANDROID_HOME/$dir" "$BW_SDK/$dir"
            fi
          done

          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$BW_SDK" > "$HOME/.bubblewrap/config.json"

      - name: Instalar Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Preparar projeto
        shell: bash
        env:
          VEZELL_LOGO_URL: https://sxghzubovthsvmfqncch.supabase.co/storage/v1/object/public/zaia-branding/1bff23ac-18cb-404c-884a-1dd89d4538cd/logo.png?v=1790957753358
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$HOME/.bubblewrap/android-sdk-wrapper"
          mkdir -p .native-build/vezell
          cp native/android/vezell/twa-manifest.json .native-build/vezell/twa-manifest.json
          base64 -d native/android/vezell/zaia-vezell-dev-keystore.b64 > .native-build/vezell/android.keystore
          curl --fail --location --silent --show-error "$VEZELL_LOGO_URL" -o .native-build/vezell/logo.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('.native-build/vezell/twa-manifest.json')
          data=json.loads(p.read_text())
          local='http://127.0.0.1:8765/logo.png'
          data['iconUrl']=local
          data['maskableIconUrl']=local
          data['monochromeIconUrl']=local
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 -m http.server 8765 --bind 127.0.0.1 --directory .native-build/vezell >/tmp/vezell-logo-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          cd .native-build/vezell
          bubblewrap update --skipVersionUpgrade --manifest=twa-manifest.json

      - name: Integrar Firebase Cloud Messaging
        shell: bash
        run: |
          set -euo pipefail
          cd .native-build/vezell

          cp "$GITHUB_WORKSPACE/native/android/vezell/google-services.json" app/google-services.json
          mkdir -p app/src/main/res/drawable
          cp "$GITHUB_WORKSPACE/native/android/vezell/ic_stat_zaia.xml" app/src/main/res/drawable/ic_stat_zaia.xml

          JAVA_DIR="$(dirname "$(find app/src/main -type f -name LauncherActivity.java -print -quit)")"
          test -n "$JAVA_DIR"
          cp "$GITHUB_WORKSPACE/native/android/vezell/LauncherActivity.java" "$JAVA_DIR/LauncherActivity.java"
          cp "$GITHUB_WORKSPACE/native/android/vezell/ZaiaFirebaseMessagingService.java" "$JAVA_DIR/ZaiaFirebaseMessagingService.java"

          python3 - <<'PY'
          from pathlib import Path

          root=Path('build.gradle')
          root_text=root.read_text()
          marker="classpath 'com.android.tools.build:gradle:"
          if "com.google.gms:google-services" not in root_text:
              pos=root_text.find(marker)
              if pos < 0:
                  raise SystemExit('Não encontrei o classpath do Android Gradle Plugin.')
              line_end=root_text.find('\n',pos)
              root_text=root_text[:line_end+1]+"        classpath 'com.google.gms:google-services:4.5.0'\n"+root_text[line_end+1:]
              root.write_text(root_text)

          app=Path('app/build.gradle')
          app_text=app.read_text()
          if "apply plugin: 'com.google.gms.google-services'" not in app_text:
              plugin_end=app_text.find('}\n', app_text.find('plugins {'))
              if plugin_end < 0:
                  raise SystemExit('Bloco plugins não encontrado.')
              plugin_end += 2
              app_text=app_text[:plugin_end]+"\napply plugin: 'com.google.gms.google-services'\n"+app_text[plugin_end:]

          if "com.google.firebase:firebase-messaging" not in app_text:
              dep_start=app_text.find('dependencies {')
              if dep_start < 0:
                  raise SystemExit('Bloco dependencies não encontrado.')
              insert=dep_start+len('dependencies {')
              firebase="\n    implementation platform('com.google.firebase:firebase-bom:34.19.0')\n    implementation 'com.google.firebase:firebase-messaging'\n"
              app_text=app_text[:insert]+firebase+app_text[insert:]
          app.write_text(app_text)

          manifest=Path('app/src/main/AndroidManifest.xml')
          m=manifest.read_text()
          if 'android.permission.POST_NOTIFICATIONS' not in m:
              manifest_end=m.find('>', m.find('<manifest'))
              if manifest_end < 0:
                  raise SystemExit('Tag manifest não encontrada.')
              m=m[:manifest_end+1]+'\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'+m[manifest_end+1:]

          service_block='''
              <meta-data
                  android:name="com.google.firebase.messaging.default_notification_icon"
                  android:resource="@drawable/ic_stat_zaia" />
              <meta-data
                  android:name="com.google.firebase.messaging.default_notification_color"
                  android:resource="@color/colorPrimary" />
              <meta-data
                  android:name="com.google.firebase.messaging.default_notification_channel_id"
                  android:value="zaia_store_notifications" />
              <service
                  android:name=".ZaiaFirebaseMessagingService"
                  android:exported="false">
                  <intent-filter>
                      <action android:name="com.google.firebase.MESSAGING_EVENT" />
                  </intent-filter>
              </service>
          '''
          if '.ZaiaFirebaseMessagingService' not in m:
              m=m.replace('</application>', service_block+'\n    </application>')
          manifest.write_text(m)
          PY

          ./gradlew :app:processReleaseGoogleServices :app:compileReleaseJavaWithJavac --no-daemon

      - name: Gerar APK e AAB
        shell: bash
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: zaia-dev-2026
          BUBBLEWRAP_KEY_PASSWORD: zaia-dev-2026
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$HOME/.bubblewrap/android-sdk-wrapper"
          cd .native-build/vezell
          bubblewrap build --skipPwaValidation --manifest=twa-manifest.json --signingKeyPath=android.keystore --signingKeyAlias=zaia-vezell-dev
          find . -maxdepth 3 -type f \( -name '*.apk' -o -name '*.aab' \) -print

      - name: Publicar APK/AAB como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Vezell-Barber-Studio-DEV-FCM
          path: |
            .native-build/vezell/**/*.apk
            .native-build/vezell/**/*.aab
          if-no-files-found: error
          retention-days: 14
