name: ZAIA App Factory - Android Test

on:
  push:
    branches: [main]
    paths:
      - 'native/apps/vezell-dev.json'
      - 'native/templates/android/**'
      - 'scripts/generate_store_android.py'
      - '.github/workflows/build-android-vezell-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CONFIG_PATH: native/apps/vezell-dev.json
      BUBBLEWRAP_KEYSTORE_PASSWORD: zaia-dev-2026
      BUBBLEWRAP_KEY_PASSWORD: zaia-dev-2026

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;36.1.0"

          BW_SDK="$HOME/.bubblewrap/android-sdk-wrapper"
          mkdir -p "$BW_SDK/bin"
          ln -sfn "$SDKMANAGER" "$BW_SDK/bin/sdkmanager"
          for dir in build-tools platform-tools platforms licenses cmdline-tools; do
            if [ -e "$ANDROID_HOME/$dir" ]; then
              rm -rf "$BW_SDK/$dir"
              ln -s "$ANDROID_HOME/$dir" "$BW_SDK/$dir"
            fi
          done

          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$BW_SDK" > "$HOME/.bubblewrap/config.json"

      - name: Instalar Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Gerar app pelo ZAIA App Factory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .native-build/store/generated
          python3 scripts/generate_store_android.py "$CONFIG_PATH" .native-build/store/generated

          export APP_NAME="$(python3 -c "import json;print(json.load(open('$CONFIG_PATH'))['appName'])")"
          export PACKAGE_ID="$(python3 -c "import json;print(json.load(open('$CONFIG_PATH'))['packageId'])")"
          export LOGO_URL="$(python3 -c "import json;print(json.load(open('$CONFIG_PATH'))['logoUrl'])")"
          export FIREBASE_CONFIG_PATH="$(python3 -c "import json;print(json.load(open('$CONFIG_PATH'))['firebaseConfigPath'])")"
          export KEYSTORE_B64_PATH="$(python3 -c "import json;print(json.load(open('$CONFIG_PATH'))['keystoreB64Path'])")"
          export KEY_ALIAS="$(python3 -c "import json;print(json.load(open('$CONFIG_PATH'))['keyAlias'])")"
          {
            echo "APP_NAME=$APP_NAME"
            echo "PACKAGE_ID=$PACKAGE_ID"
            echo "LOGO_URL=$LOGO_URL"
            echo "FIREBASE_CONFIG_PATH=$FIREBASE_CONFIG_PATH"
            echo "KEYSTORE_B64_PATH=$KEYSTORE_B64_PATH"
            echo "KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Preparar projeto Bubblewrap
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$HOME/.bubblewrap/android-sdk-wrapper"
          cp .native-build/store/generated/twa-manifest.json .native-build/store/twa-manifest.json
          base64 -d "$KEYSTORE_B64_PATH" > .native-build/store/android.keystore
          curl --fail --location --silent --show-error "$LOGO_URL" -o .native-build/store/logo.png

          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('.native-build/store/twa-manifest.json')
          data=json.loads(p.read_text())
          local='http://127.0.0.1:8765/logo.png'
          data['iconUrl']=local
          data['maskableIconUrl']=local
          data['monochromeIconUrl']=local
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY

          python3 -m http.server 8765 --bind 127.0.0.1 --directory .native-build/store >/tmp/zaia-app-factory-logo.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          cd .native-build/store
          bubblewrap update --skipVersionUpgrade --manifest=twa-manifest.json

      - name: Integrar Firebase Cloud Messaging
        shell: bash
        run: |
          set -euo pipefail
          cd .native-build/store

          test -f "$GITHUB_WORKSPACE/$FIREBASE_CONFIG_PATH"
          cp "$GITHUB_WORKSPACE/$FIREBASE_CONFIG_PATH" app/google-services.json

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          expected=os.environ['PACKAGE_ID']
          data=json.loads(Path('app/google-services.json').read_text())
          packages=[
            c.get('client_info',{}).get('android_client_info',{}).get('package_name')
            for c in data.get('client',[])
          ]
          if expected not in packages:
              raise SystemExit(f'Firebase não contém o pacote {expected}. Encontrados: {packages}')
          PY

          JAVA_DIR="$(dirname "$(find app/src/main -type f -name LauncherActivity.java -print -quit)")"
          test -n "$JAVA_DIR"
          cp generated/LauncherActivity.java "$JAVA_DIR/LauncherActivity.java"
          cp generated/ZaiaFirebaseMessagingService.java "$JAVA_DIR/ZaiaFirebaseMessagingService.java"
          mkdir -p app/src/main/res/drawable
          cp "$GITHUB_WORKSPACE/native/templates/android/ic_stat_zaia.xml" app/src/main/res/drawable/ic_stat_zaia.xml

          python3 - <<'PY'
          from pathlib import Path

          root=Path('build.gradle')
          root_text=root.read_text()
          marker="classpath 'com.android.tools.build:gradle:"
          if "com.google.gms:google-services" not in root_text:
              pos=root_text.find(marker)
              if pos < 0:
                  raise SystemExit('Android Gradle Plugin não encontrado.')
              line_end=root_text.find('\n',pos)
              root_text=root_text[:line_end+1]+"        classpath 'com.google.gms:google-services:4.5.0'\n"+root_text[line_end+1:]
              root.write_text(root_text)

          app=Path('app/build.gradle')
          app_text=app.read_text()
          if "apply plugin: 'com.google.gms.google-services'" not in app_text:
              plugin_end=app_text.find('}\n', app_text.find('plugins {'))
              if plugin_end < 0:
                  raise SystemExit('Bloco plugins não encontrado.')
              plugin_end += 2
              app_text=app_text[:plugin_end]+"\napply plugin: 'com.google.gms.google-services'\n"+app_text[plugin_end:]

          if "com.google.firebase:firebase-messaging" not in app_text:
              dep_start=app_text.find('dependencies {')
              if dep_start < 0:
                  raise SystemExit('Bloco dependencies não encontrado.')
              insert=dep_start+len('dependencies {')
              firebase="\n    implementation platform('com.google.firebase:firebase-bom:34.19.0')\n    implementation 'com.google.firebase:firebase-messaging'\n"
              app_text=app_text[:insert]+firebase+app_text[insert:]
          app.write_text(app_text)

          manifest=Path('app/src/main/AndroidManifest.xml')
          m=manifest.read_text()
          if 'android.permission.POST_NOTIFICATIONS' not in m:
              manifest_end=m.find('>', m.find('<manifest'))
              if manifest_end < 0:
                  raise SystemExit('Tag manifest não encontrada.')
              m=m[:manifest_end+1]+'\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'+m[manifest_end+1:]

          service_block='''
              <meta-data
                  android:name="com.google.firebase.messaging.default_notification_icon"
                  android:resource="@drawable/ic_stat_zaia" />
              <meta-data
                  android:name="com.google.firebase.messaging.default_notification_color"
                  android:resource="@color/colorPrimary" />
              <meta-data
                  android:name="com.google.firebase.messaging.default_notification_channel_id"
                  android:value="zaia_store_notifications" />
              <service
                  android:name=".ZaiaFirebaseMessagingService"
                  android:exported="false">
                  <intent-filter>
                      <action android:name="com.google.firebase.MESSAGING_EVENT" />
                  </intent-filter>
              </service>
          '''
          if '.ZaiaFirebaseMessagingService' not in m:
              m=m.replace('</application>', service_block+'\n    </application>')
          manifest.write_text(m)
          PY

          ./gradlew :app:processReleaseGoogleServices :app:compileReleaseJavaWithJavac --no-daemon

      - name: Gerar APK e AAB
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$HOME/.bubblewrap/android-sdk-wrapper"
          cd .native-build/store
          bubblewrap build --skipPwaValidation --manifest=twa-manifest.json --signingKeyPath=android.keystore --signingKeyAlias="$KEY_ALIAS"
          find . -maxdepth 3 -type f \( -name '*.apk' -o -name '*.aab' \) -print

      - name: Publicar pacote de teste
        uses: actions/upload-artifact@v4
        with:
          name: ZAIA-App-Factory-Vezell-DEV
          path: |
            .native-build/store/**/*.apk
            .native-build/store/**/*.aab
            .native-build/store/generated/assetlinks-entry.json
            .native-build/store/generated/build-metadata.json
          if-no-files-found: error
          retention-days: 14
