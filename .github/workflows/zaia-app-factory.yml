name: ZAIA App Factory

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zaia-app-factory.yml'
      - 'scripts/zaia_app_factory_build.sh'
      - 'scripts/zaia_app_factory_patch.py'
      - 'scripts/generate_store_android.py'
      - 'native/templates/android/**'

permissions:
  contents: write
  id-token: write

concurrency:
  group: zaia-app-factory
  cancel-in-progress: false

jobs:
  build-next:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FACTORY_URL: https://sxghzubovthsvmfqncch.supabase.co/functions/v1/zaia-app-factory
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Instalar Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Executar ZAIA App Factory
        shell: bash
        run: bash scripts/zaia_app_factory_build.sh

      - name: Guardar artefatos do build
        if: always() && hashFiles('.factory/release/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ZAIA-App-Factory-${{ github.run_id }}
          path: |
            .factory/release/*.apk
            .factory/release/*.aab
            .native-build/store/generated/assetlinks-entry.json
            .native-build/store/generated/build-metadata.json
          if-no-files-found: ignore
          retention-days: 14
