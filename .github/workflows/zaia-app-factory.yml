      - name: Publicar APK
        if: steps.claim.outputs.has_job == 'true'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="zaia-app-${PROFILE_ID}-v${VERSION_CODE}"
          APK_NAME="${ARTIFACT_SLUG}.apk"
          AAB_NAME="${ARTIFACT_SLUG}.aab"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              ".factory/release/$APK_NAME" \
              ".factory/release/$AAB_NAME" \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              ".factory/release/$APK_NAME" \
              ".factory/release/$AAB_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ZAIA App â€¢ ${APP_NAME} â€¢ ${VERSION_NAME}" \
              --notes "Pacote gerado automaticamente pelo ZAIA App Factory." \
              --prerelease
          fi

          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK_NAME}"
          AAB_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${AAB_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"
          echo "aab_url=$AAB_URL" >> "$GITHUB_OUTPUT"

      - name: Concluir no ZAIA
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          OIDC="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=zaia-app-factory" | jq -r '.value')"
          echo "::add-mask::$OIDC"

          jq -n \
            --arg mode "complete" \
            --arg profile_id "$PROFILE_ID" \
            --arg apk_url "${{ steps.publish.outputs.apk_url }}" \
            --arg aab_url "${{ steps.publish.outputs.aab_url }}" \
            --arg release_tag "${{ steps.publish.outputs.tag }}" \
            '{mode:$mode,profile_id:$profile_id,apk_url:$apk_url,aab_url:$aab_url,release_tag:$release_tag}' \
            > .factory/complete.json

          curl --fail-with-body --silent --show-error \
            -X POST "$FACTORY_URL" \
            -H "Authorization: Bearer $OIDC" \
            -H "Content-Type: application/json" \
            --data-binary @.factory/complete.json \
            > /dev/null

      - name: Guardar artefatos da execuÃ§Ã£o
        if: steps.claim.outputs.has_job == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ZAIA-App-${{ steps.claim.outputs.profile_id }}
          path: |
            .factory/release/*.apk
            .factory/release/*.aab
            .native-build/store/generated/assetlinks-entry.json
            .native-build/store/generated/build-metadata.json
          if-no-files-found: error
          retention-days: 14

      - name: Registrar falha no ZAIA
        if: failure() && steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set +e
          OIDC="$(curl --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=zaia-app-factory" | jq -r '.value')"
          echo "::add-mask::$OIDC"

          jq -n \
            --arg mode "fail" \
            --arg profile_id "${{ steps.claim.outputs.profile_id }}" \
            --arg error "Build Android falhou. ExecuÃ§Ã£o GitHub Actions: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{mode:$mode,profile_id:$profile_id,error:$error}' \
            > .factory/fail.json

          curl --silent --show-error \
            -X POST "$FACTORY_URL" \
            -H "Authorization: Bearer $OIDC" \
            -H "Content-Type: application/json" \
            --data-binary @.factory/fail.json \
            > /dev/null
