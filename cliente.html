<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#351523" />
  <meta name="description" content="ZAIA Cliente — encontre estabelecimentos, agende horários, acompanhe seu histórico e receba lembretes." />
  <link rel="canonical" href="https://zaia.nethanel.com.br/cliente" />
  <link rel="manifest" href="/manifest-cliente.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/map-enhancement.css" />
  <link rel="stylesheet" href="/operational.css" />
  <link rel="stylesheet" href="/rating.css" />
  <title>ZAIA Cliente — Agendamentos e serviços</title>
</head>
<body>
  <div id="app"></div>
  <script>window.ZAIA_APP_CONTEXT='customer'</script>
  <script src="/session-scope.js"></script>
  <script src="/config.js"></script>
  <script>
    (() => {
      const CANONICAL_ORIGIN = 'https://zaia.nethanel.com.br'
      const LEGACY_ORIGIN = 'https://nethanel-beauty.vercel.app'

      if (location.origin === LEGACY_ORIGIN) {
        location.replace(CANONICAL_ORIGIN + location.pathname + location.search + location.hash)
        return
      }

      document.addEventListener('click', event => {
        const button = event.target.closest?.('#clientGoogleLogin')
        if (!button || location.origin !== CANONICAL_ORIGIN) return

        const supabaseUrl = String(window.BEAUTY_CONFIG?.supabaseUrl || '').replace(/\/$/, '')
        if (!supabaseUrl) return

        event.preventDefault()
        event.stopImmediatePropagation()
        localStorage.setItem('zaia_google_return_to', location.pathname + location.search)

        const url = new URL(`${supabaseUrl}/auth/v1/authorize`)
        url.searchParams.set('provider', 'google')
        url.searchParams.set('redirect_to', `${CANONICAL_ORIGIN}/cliente`)
        location.assign(url.toString())
      }, true)
    })()
  </script>
  <script type="module">
    const authHash = new URLSearchParams(location.hash.replace(/^#/, ''))
    const isRecovery = authHash.get('type') === 'recovery'
    if (isRecovery) {
      import('/auth-recovery.js')
    } else {
      import('/client-shell.js')
      import('/client.js')
      import('/customer-arrival.js')
      import('/customer-rating.js')
      import('/map-enhancement.js')
      import('/customer-privacy.js')
      import('/customer-help.js')
      import('/production-guard.js')
      import('/auth-recovery.js')
    }
  </script>
</body>
</html>
