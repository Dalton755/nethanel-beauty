<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#351523" />
  <meta name="description" content="ZAIA Negócios — gestão inteligente para salões, barbearias, studios e negócios de beleza." />
  <link rel="canonical" href="https://zaia.nethanel.com.br/loja" />
  <link rel="manifest" href="/manifest-loja.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/pro-plans.css" />
  <link rel="stylesheet" href="/operational.css" />
  <link rel="stylesheet" href="/professional-services-fix.css" />
  <link rel="stylesheet" href="/rating.css?v=20261003-premium1" />
  <link rel="stylesheet" href="/merchant-premium-ui.css?v=20261003-premium1" />
  <title>ZAIA Negócios — Gestão do estabelecimento</title>
</head>
<body>
  <div id="app"></div>
  <script>
    (()=>{
      const canonical='https://zaia.nethanel.com.br'
      const legacy='https://nethanel-beauty.vercel.app'
      if(location.origin===legacy){
        location.replace(canonical+location.pathname+location.search+location.hash)
      }
    })()
  </script>
  <script>window.ZAIA_APP_CONTEXT='merchant'</script>
  <script src="/session-scope.js?v=20261003-premium1"></script>
  <script src="/config.js"></script>
  <script type="module">
    const authHash = new URLSearchParams(location.hash.replace(/^#/, ''))
    const isRecovery = authHash.get('type') === 'recovery'
    if (isRecovery) {
      import('/auth-recovery.js')
    } else {
      import('/merchant-shell.js')
      import('/app.js')
      import('/operational-engine.js')
      import('/business-rating.js?v=20261003-premium1')
      import('/merchant-premium-ui.js?v=20261003-premium1')
      import('/pro-plans.js')
      import('/merchant-help.js')
      import('/production-guard.js')
      import('/auth-recovery.js')
    }
  </script>
</body>
</html>
